<svg xmlns="http://www.w3.org/2000/svg" class="sfs-coffee-iq-diagram" viewBox="0 0 560 190" role="img" aria-labelledby="coffee-iq-title coffee-iq-desc" style="display:block;width:100%;max-width:35rem;height:auto;margin:0 auto;">
  <title id="coffee-iq-title">Coffee consumption and IQ: a correlation</title>
  <desc id="coffee-iq-desc">Two blue dots represent X, coffee consumption, and Y, IQ score. A solid line connects them, labeled small positive correlation, r equals .15. The value is illustrative, not an estimate from the study. The line has no arrow because correlation does not establish causal direction.</desc>
  <line x1="110" y1="88" x2="450" y2="88" stroke="var(--sfs-text, #212529)" stroke-width="3" />
  <g fill="var(--graph-series-1, #0072b2)" stroke="var(--sfs-bg, #fff)" stroke-width="3">
    <circle cx="110" cy="88" r="13" />
    <circle cx="450" cy="88" r="13" />
  </g>
  <g fill="var(--sfs-text, #212529)" text-anchor="middle" font-family="inherit" font-size="22">
    <text x="280" y="30">Small positive correlation</text>
    <text x="280" y="61" font-weight="600"><tspan font-style="italic">r</tspan> = .15</text>
    <g font-size="24" font-weight="600">
      <text x="110" y="133"><tspan font-style="italic">X</tspan>: Coffee</text>
      <text x="110" y="162">consumption</text>
      <text x="450" y="133"><tspan font-style="italic">Y</tspan>: IQ score</text>
    </g>
  </g>
</svg>
