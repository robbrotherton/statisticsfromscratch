<svg xmlns="http://www.w3.org/2000/svg" class="sfs-coffee-iq-diagram" viewBox="0 0 560 390" role="img" aria-labelledby="coffee-third-title coffee-third-desc" style="display:block;width:100%;max-width:35rem;height:auto;margin:0 auto;">
  <title id="coffee-third-title">Accounting for a third variable</title>
  <desc id="coffee-third-desc">An open triangle connects X, coffee consumption, Y, IQ score, and Z, socioeconomic status. Illustrative positive correlations link Z to X, r equals .25, and Z to Y, r equals .45. The X to Y line is now dashed: the partial correlation is approximately .04 after accounting for Z, compared with .15 before. These are mathematically consistent teaching values, not study estimates. None of the lines establishes causation.</desc>
  <g fill="none" stroke="var(--sfs-text, #212529)" stroke-width="3" stroke-linecap="round">
    <path d="M110 260 L280 80 L450 260" />
    <line x1="110" y1="260" x2="450" y2="260" stroke-dasharray="7 7" />
  </g>
  <g fill="var(--graph-series-1, #0072b2)" stroke="var(--sfs-bg, #fff)" stroke-width="3">
    <circle cx="110" cy="260" r="13" />
    <circle cx="450" cy="260" r="13" />
    <circle cx="280" cy="80" r="13" fill="var(--graph-series-2, #e69f00)" />
  </g>
  <g fill="var(--sfs-text, #212529)" text-anchor="middle" font-family="inherit" font-size="22">
    <g font-size="24" font-weight="600">
      <text x="280" y="35"><tspan font-style="italic">Z</tspan>: Socioeconomic status</text>
      <text x="110" y="305"><tspan font-style="italic">X</tspan>: Coffee</text>
      <text x="110" y="334">consumption</text>
      <text x="450" y="305"><tspan font-style="italic">Y</tspan>: IQ score</text>
    </g>
    <text x="107" y="135">Positive</text>
    <text x="107" y="165" font-weight="600"><tspan font-style="italic">r</tspan> = .25</text>
    <text x="453" y="135">Positive</text>
    <text x="453" y="165" font-weight="600"><tspan font-style="italic">r</tspan> = .45</text>
    <text x="280" y="211">Accounting for <tspan font-style="italic">Z</tspan></text>
    <text x="280" y="242" font-weight="600">Partial <tspan font-style="italic">r</tspan> ≈ .04</text>
    <text x="280" y="379" font-size="20" fill="var(--sfs-muted, #6c757d)">Illustrative values</text>
  </g>
</svg>
