<svg xmlns="http://www.w3.org/2000/svg" class="sfs-maze sfs-maze-easy" viewBox="0 0 408 350" role="img" tabindex="0" aria-labelledby="sfs-maze-easy-title sfs-maze-easy-desc" data-maze='{"size":11,"entrance":[0,5],"exit":[10,5],"open":"3130123122230223323212320200222322230322020222302103230023123122223212223022221222210230222023322220223000210211101111110","route":[[0,5],[0,4],[0,3],[0,2],[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[2,7],[2,8],[2,9],[2,10],[3,10],[3,9],[4,9],[4,8],[4,7],[4,6],[4,5],[4,4],[4,3],[5,3],[5,4],[6,4],[6,3],[6,2],[6,1],[6,0],[7,0],[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,6],[8,7],[8,8],[8,9],[9,9],[9,8],[9,7],[10,7],[10,6],[10,5]],"forks":[{"at":3,"wrong":[0,1],"trap":false},{"at":8,"wrong":[0,6],"trap":false},{"at":13,"wrong":[1,10],"trap":false},{"at":20,"wrong":[3,5],"trap":false},{"at":28,"wrong":[5,1],"trap":false},{"at":32,"wrong":[7,1],"trap":false},{"at":35,"wrong":[7,4],"trap":false},{"at":43,"wrong":[9,6],"trap":false}],"seeds":{"route":594,"forks":1}}' style="display:block;width:100%;max-width:22rem;height:auto;margin:0 auto;">
  <title id="sfs-maze-easy-title">Easy maze (select to replay)</title>
  <desc id="sfs-maze-easy-desc">The easy maze. The entrance is in the middle of the left side and the exit is straight across on the right. The route has 8 places where it forks. At every fork, the wrong way leads left or away from the exit, so heading toward the exit is always right. A red marker line traces the route straight through.</desc>
  <style>
    .sfs-maze-easy .sfs-maze-route { stroke-dasharray: 1478; stroke-dashoffset: 0; }
    .sfs-maze-easy.is-animated { cursor: pointer; }
    .sfs-maze-easy.is-waiting .sfs-maze-route { stroke-dashoffset: 1478; }
    .sfs-maze-easy.is-drawing .sfs-maze-route { animation: sfs-maze-easy-draw 3.8s linear both; }
    .sfs-maze-easy.is-fading .sfs-maze-route { opacity: 0; transition: opacity 0.4s ease; }
    @keyframes sfs-maze-easy-draw {
      from { stroke-dashoffset: 1478; }
      to { stroke-dashoffset: 0; }
    }
  </style>
  <script>
    (function () {
      var svg = document.currentScript ? document.currentScript.closest("svg") : null;
      if (!svg || !window.matchMedia) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      svg.classList.add("is-animated", "is-waiting");
      function draw() {
        svg.classList.remove("is-waiting", "is-fading", "is-drawing");
        void svg.getBoundingClientRect();
        svg.classList.add("is-drawing");
      }
      function replay() {
        if (svg.classList.contains("is-waiting") || svg.classList.contains("is-fading")) return;
        svg.classList.add("is-fading");
        setTimeout(draw, 450);
      }
      if ("IntersectionObserver" in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) { if (e.isIntersecting) { io.disconnect(); draw(); } });
        }, { threshold: 0.6 });
        io.observe(svg);
      } else {
        draw();
      }
      svg.addEventListener("click", replay);
      svg.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); replay(); }
      });
    })();
  </script>
