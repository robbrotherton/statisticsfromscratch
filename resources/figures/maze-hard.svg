<svg xmlns="http://www.w3.org/2000/svg" class="sfs-maze sfs-maze-hard" viewBox="0 0 408 350" role="img" tabindex="0" aria-labelledby="sfs-maze-hard-title sfs-maze-hard-desc" data-maze='{"size":11,"entrance":[0,5],"exit":[10,5],"open":"3232323331003010100112302311131123301212231000311230110110310231103120310231212111102102311031111122123111221211101111010","route":[[0,5],[1,5],[2,5],[2,4],[3,4],[4,4],[4,3],[3,3],[3,2],[4,2],[5,2],[6,2],[7,2],[7,3],[7,4],[6,4],[6,5],[6,6],[5,6],[4,6],[4,7],[3,7],[2,7],[2,6],[1,6],[0,6],[0,7],[1,7],[1,8],[0,8],[0,9],[0,10],[1,10],[2,10],[3,10],[3,9],[4,9],[4,8],[5,8],[6,8],[7,8],[7,7],[7,6],[7,5],[8,5],[9,5],[10,5]],"forks":[{"at":5,"wrong":[5,4],"trap":true},{"at":12,"wrong":[8,2],"trap":true},{"at":15,"wrong":[6,3],"trap":false},{"at":20,"wrong":[5,7],"trap":true},{"at":28,"wrong":[2,8],"trap":true},{"at":33,"wrong":[2,9],"trap":false},{"at":36,"wrong":[5,9],"trap":true},{"at":40,"wrong":[8,8],"trap":true}],"seeds":{"route":19949,"forks":3}}' style="display:block;width:100%;max-width:22rem;height:auto;margin:0 auto;">
  <title id="sfs-maze-hard-title">Hard maze (select to replay)</title>
  <desc id="sfs-maze-hard-desc">The hard maze. The entrance is in the middle of the left side and the exit is straight across on the right. The route has 8 places where it forks. The route is the same length as the easy one, but at 6 of the forks the way that heads toward the exit is a short dead end, and the real route turns up, down or back. A red marker line traces the route at the same speed, but it goes into each of those dead ends and backs out, so it takes longer to finish.</desc>
  <style>
    .sfs-maze-hard .sfs-maze-route { stroke-dasharray: 2578; stroke-dashoffset: 0; }
    .sfs-maze-hard.is-animated { cursor: pointer; }
    .sfs-maze-hard.is-waiting .sfs-maze-route { stroke-dashoffset: 2578; }
    .sfs-maze-hard.is-drawing .sfs-maze-route { animation: sfs-maze-hard-draw 6.7s linear both; }
    .sfs-maze-hard.is-fading .sfs-maze-route { opacity: 0; transition: opacity 0.4s ease; }
    @keyframes sfs-maze-hard-draw {
      from { stroke-dashoffset: 2578; }
      to { stroke-dashoffset: 0; }
    }
  </style>
  <script>
    (function () {
      var svg = document.currentScript ? document.currentScript.closest("svg") : null;
      if (!svg || !window.matchMedia) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      svg.classList.add("is-animated", "is-waiting");
      function draw() {
        svg.classList.remove("is-waiting", "is-fading", "is-drawing");
        void svg.getBoundingClientRect();
        svg.classList.add("is-drawing");
      }
      function replay() {
        if (svg.classList.contains("is-waiting") || svg.classList.contains("is-fading")) return;
        svg.classList.add("is-fading");
        setTimeout(draw, 450);
      }
      if ("IntersectionObserver" in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) { if (e.isIntersecting) { io.disconnect(); draw(); } });
        }, { threshold: 0.6 });
        io.observe(svg);
      } else {
        draw();
      }
      svg.addEventListener("click", replay);
      svg.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); replay(); }
      });
    })();
  </script>
