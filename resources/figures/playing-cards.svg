<svg xmlns="http://www.w3.org/2000/svg" class="sfs-playing-cards" viewBox="0 0 340 148"
     role="img" data-reveal-on-view="is-dealt"
     font-family="'Source Sans 3', system-ui, sans-serif" font-size="22" font-weight="700"
     text-anchor="middle"
     style="display: block; width: 100%; max-width: 27rem; margin: 1.75rem auto;
            color: var(--quarto-scss-export-callout-color-tip, #18bc9c);">
  <title>Three playing cards: the three of clubs and the five of hearts turned face up, and a third card still face down.</title>

  <defs>
    <path id="sfs-card-heart" d="M0 9.8C-6.6 3.6-8.8.4-8.8-3.2A5.2 5.2 0 0 1 0-6.6 5.2 5.2 0 0 1 8.8-3.2C8.8.4 6.6 3.6 0 9.8Z"/>
    <g id="sfs-card-club">
      <circle cy="-4.4" r="4.7"/>
      <circle cx="-4.4" cy="2" r="4.7"/>
      <circle cx="4.4" cy="2" r="4.7"/>
      <path d="M0 1.2C1.4 5.8 3.2 8.8 5.8 10.8H-5.8C-3.2 8.8-1.4 5.8 0 1.2Z"/>
    </g>

    <!-- Corner index: rank over suit, repeated upside down in the far corner.
         Both are centred on the same axis, so the rank sits over its pip. -->
    <g id="sfs-card-index-3">
      <text x="12" y="26">3</text>
      <use href="#sfs-card-club" transform="translate(12 36) scale(0.5)"/>
    </g>
    <g id="sfs-card-index-5">
      <text x="12" y="26">5</text>
      <use href="#sfs-card-heart" transform="translate(12 36) scale(0.5)"/>
    </g>

    <g id="sfs-card-pips-3">
      <use href="#sfs-card-index-3"/>
      <use href="#sfs-card-index-3" transform="rotate(180 50 70)"/>
      <use href="#sfs-card-club" transform="translate(50 34) scale(1.1)"/>
      <use href="#sfs-card-club" transform="translate(50 70) scale(1.1)"/>
      <use href="#sfs-card-club" transform="translate(50 106) rotate(180) scale(1.1)"/>
    </g>

    <g id="sfs-card-pips-5">
      <use href="#sfs-card-index-5"/>
      <use href="#sfs-card-index-5" transform="rotate(180 50 70)"/>
      <use href="#sfs-card-heart" transform="translate(31 34) scale(1.1)"/>
      <use href="#sfs-card-heart" transform="translate(69 34) scale(1.1)"/>
      <use href="#sfs-card-heart" transform="translate(50 70) scale(1.1)"/>
      <use href="#sfs-card-heart" transform="translate(31 106) rotate(180) scale(1.1)"/>
      <use href="#sfs-card-heart" transform="translate(69 106) rotate(180) scale(1.1)"/>
    </g>

    <pattern id="sfs-card-weave" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V11M0 0H11" fill="none" stroke="#fdfcfa" stroke-opacity="0.32" stroke-width="1.6"/>
    </pattern>

    <!-- currentColor, so the back takes the green set on the root above. -->
    <g id="sfs-card-reverse">
      <rect x="6" y="6" width="88" height="128" rx="5" fill="currentColor"/>
      <rect x="6" y="6" width="88" height="128" rx="5" fill="url(#sfs-card-weave)"/>
    </g>
  </defs>

  <!-- Every colour is a presentation attribute, set out here on the elements
       that do the referencing. Page rules cannot reach inside a use copy, and
       an inline SVG cannot safely carry a style element of its own, so the
       stylesheet only ever animates the turn. Placement stays on an outer
       group: the turn animates the transform, which would otherwise replace
       each card's translate. -->
  <g transform="translate(4 4)">
    <g class="sfs-card-turn">
      <rect class="sfs-card-face" width="100" height="140" rx="8" fill="#fdfcfa" stroke="#000" stroke-opacity="0.3"/>
      <g class="sfs-card-front" fill="#1e1e1e"><use href="#sfs-card-pips-3"/></g>
      <g class="sfs-card-back" opacity="0"><use href="#sfs-card-reverse"/></g>
    </g>
  </g>

  <g transform="translate(120 4)" style="--sfs-turn-delay: 420ms;">
    <g class="sfs-card-turn">
      <rect class="sfs-card-face" width="100" height="140" rx="8" fill="#fdfcfa" stroke="#000" stroke-opacity="0.3"/>
      <g class="sfs-card-front" fill="#d1495b"><use href="#sfs-card-pips-5"/></g>
      <g class="sfs-card-back" opacity="0"><use href="#sfs-card-reverse"/></g>
    </g>
  </g>

  <g transform="translate(236 4)">
    <rect class="sfs-card-face" width="100" height="140" rx="8" fill="#fdfcfa" stroke="#000" stroke-opacity="0.3"/>
    <use href="#sfs-card-reverse"/>
  </g>
</svg>
