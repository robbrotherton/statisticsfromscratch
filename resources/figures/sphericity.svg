<svg xmlns="http://www.w3.org/2000/svg" class="sfs-sphericity-diagram" viewBox="0 0 560 370" role="img" aria-labelledby="sphericity-title sphericity-desc" style="display:block;width:100%;max-width:34rem;height:auto;margin:0 auto;overflow:visible;">
  <title id="sphericity-title">Sphericity</title>
  <desc id="sphericity-desc">Three dots, one for each condition (first alone, second alone, and competition), sit in a triangle on a circle. The circle is split into three dashed arcs, one between each pair of conditions. Each arc is labeled with the variance of the difference scores for that pair, and all three arcs are drawn identically to show that the three variances are equal.</desc>
  <g fill="none" stroke="var(--sfs-text, #212529)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round">
    <path d="M 280 90 A 110 110 0 0 1 375.26 255" />
    <path d="M 375.26 255 A 110 110 0 0 1 184.74 255" />
    <path d="M 184.74 255 A 110 110 0 0 1 280 90" />
  </g>
  <g fill="var(--graph-series-1, #0072b2)" stroke="var(--sfs-bg, #fff)" stroke-width="3">
    <circle cx="280" cy="90" r="13" />
    <circle cx="375.26" cy="255" r="13" />
    <circle cx="184.74" cy="255" r="13" />
  </g>
  <g fill="var(--sfs-text, #212529)" font-size="19" font-weight="600">
    <text x="280" y="64" text-anchor="middle">First alone</text>
    <text x="397" y="262" text-anchor="start">Second alone</text>
    <text x="163" y="262" text-anchor="end">Competition</text>
  </g>
  <foreignObject x="392" y="110" width="168" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:19px;line-height:40px;text-align:left;color:var(--sfs-text);">$\sigma^2_{\text{first} - \text{second}}$</div>
  </foreignObject>
  <foreignObject x="130" y="318" width="300" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:19px;line-height:40px;text-align:center;color:var(--sfs-text);">$\sigma^2_{\text{second} - \text{competition}}$</div>
  </foreignObject>
  <foreignObject x="0" y="110" width="168" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:19px;line-height:40px;text-align:right;color:var(--sfs-text);">$\sigma^2_{\text{first} - \text{competition}}$</div>
  </foreignObject>
</svg>
